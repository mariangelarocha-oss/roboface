<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboFace — Redirecionando...</title>
  
  <!-- Redirecionamento automático imediato (0 segundos) -->
  <meta http-equiv="refresh" content="0;url=https://roboticainterativa.github.io/roboface/">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #080c14;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #151d2b;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #34425d;
      max-width: 450px;
    }
    a {
      color: #3975ff;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>

  <!-- Redirecionamento de segurança via JavaScript -->
  <script>
    window.location.href = "https://roboticainterativa.github.io/roboface/";
  </script>
</head>
<body>
  <div class="card">
    <h2>🤖 RoboFace mudou de endereço!</h2>
    <p>Estamos te redirecionando automaticamente para a nova página oficial...</p>
    <p>Se você não for redirecionado em alguns segundos, <a href="https://roboticainterativa.github.io/roboface/">clique aqui para acessar</a>.</p>
  </div>
</body>
</html>
